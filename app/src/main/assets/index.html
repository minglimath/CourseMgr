function normalizeS(d){

  if(!Array.isArray(n.students))n.students=[];
  n.students=n.students.map(st=>{
    const ids=Array.isArray(st.courseIds)&&st.courseIds.length?st.courseIds:(st.courseId?[st.courseId]:(firstCourseId?[firstCourseId]:[]));
    return{...st,courseIds:[...new Set(ids.filter(Boolean))],courseId:ids[0]||""};
  });
  if(!n.attendance||typeof n.attendance!=="object")n.attendance={};

  n.schedules=n.schedules.map(sc=>{
    const st=n.students.find(x=>x.id===sc.studentId);
    const cid=sc.courseId||(st&&st.courseIds&&st.courseIds[0])||firstCourseId;

        </div>
        <div class="header-actions"><button class="export-btn" data-action="export">📊 导出CSV</button><button class="export-btn" data-action="export-data">导出数据</button><button class="export-btn" data-action="import-data">导入数据</button><button class="reset-btn" data-action="reset-data">🔄 初始化</button><input id="data-import-input" class="file-input" type="file" accept="application/json,.json"></div>
      </div>

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");if(!el)return;
  const a=el.dataset.action;
  if(a==="tab"){su({tab:+el.dataset.idx});return;}
  if(a==="export"){exportCSV();return;}
  if(a==="export-data"){exportData();return;}
  if(a==="import-data"){document.getElementById("data-import-input").click();return;}
  if(a==="modal-close"){if(e.target===el)su({modal:null});return;}
  if(a==="cprev"){const m=UI.calM-1;if(m<1)su({calY:UI.calY-1,calM:12});else su({calM:m});return;}
  if(a==="cnext"){const m=UI.calM+1;if(m>12)su({calY:UI.calY+1,calM:1});else su({calM:m});return;}

  if(a==="add-teacher"){su({modal:{type:"add-teacher"}});return;}
  if(a==="edit-teacher"){su({modal:{type:"edit-teacher",tid:el.dataset.tid}});return;}
  if(a==="del-teacher"){delTeacher(el.dataset.tid);return;}
  if(a==="confirm-teacher"){
    const name=document.getElementById("nt-name").value.trim();const color=document.getElementById("nt-color").value;const note=document.getElementById("nt-note").value.trim();
    if(!name){alert("请输入老师姓名");return;}
    if(el.dataset.tid)updTeacher(el.dataset.tid,{name,color,note});else addTeacher({name,color,note});
    su({modal:null});return;}
  if(a==="add-schedule"){if(!(S.teachers||[]).length){alert("请先添加老师");return;}su({modal:{type:"add-schedule"}});return;}
  if(a==="edit-schedule"){su({modal:{type:"edit-schedule",sid:el.dataset.sid}});return;}
  if(a==="confirm-schedule"){
    const teacherId=document.getElementById("sc-teacher").value,studentId=document.getElementById("sc-student").value,courseId=document.getElementById("sc-course").value,date=document.getElementById("sc-date").value,time=document.getElementById("sc-time").value,note=document.getElementById("sc-note").value.trim();
    if(!teacherId||!studentId||!courseId||!date||!time){alert("请完整填写老师、学员、课程、日期和时间");return;}
    const sid=el.dataset.sid;
    if(sid){const status=document.getElementById("sc-status").value;const data={teacherId,studentId,courseId,date,time,note,status};const c=conflict(data,sid);if(c){alert(conflictMsg(c,data));return;}updSchedule(sid,data);su({modal:null});return;}
    const repeat=document.getElementById("sc-repeat").value,weeks=Math.max(1,parseInt(document.getElementById("sc-weeks").value)||1);
    const list=Array.from({length:repeat==="weekly"?weeks:1},(_,i)=>({teacherId,studentId,courseId,date:addDays(date,i*7),time,note,status:"pending"}));
    const bad=list.map(x=>conflict(x)).find(Boolean);if(bad){alert(conflictMsg(bad,list.find(x=>x.date===bad.date&&x.time===bad.time)));return;}
    addScheduleList(list);su({modal:null});return;}
  if(a==="complete-schedule"){completeSchedule(el.dataset.sid);su({modal:null});return;}
  if(a==="cancel-schedule"){updSchedule(el.dataset.sid,{status:"cancelled"});su({modal:null});return;}
  if(a==="del-schedule"){delSchedule(el.dataset.sid);su({modal:null});return;}
  if(a==="att"){
    const sid=el.dataset.sid,dt=el.dataset.date;
    const cid=el.dataset.courseId||primaryCourseId(sid);
    if(ahc(sid,dt,cid)){setAttendanceForCourse(sid,dt,null,cid);}
    else{su({modal:{type:"time-pick",sid,date:dt,courseId:cid}});}
    return;}
  if(a==="time-confirm"){
    const t=document.getElementById("time-input");
    const val=t?t.value:"";const cid=document.getElementById("time-course").value||el.dataset.courseId;
    setAttendanceForCourse(el.dataset.sid,el.dataset.date,val||1,cid);
    su({modal:null});return;}
  if(a==="addstu"){su({modal:{type:"add-student"}});return;}
  if(a==="confirm-add-student"){
    const n=document.getElementById("ns-name").value.trim();
    const courseIds=selectedValues("ns-courses");
    const note=document.getElementById("ns-note").value.trim();
    if(!n){alert("请输入学员姓名");return;}
    if(!courseIds.length){alert("请至少选择一个课程/班级");return;}
    addStu({name:n,courseIds,note});su({modal:null});return;}
  if(a==="editstu"){su({modal:{type:"edit-student",sid:el.dataset.sid}});return;}
  if(a==="delstu"){delStu(el.dataset.sid);return;}
  if(a==="confirm-edit-student"){
    const sid=el.dataset.sid;
    const n=document.getElementById("es-name").value.trim();
    const courseIds=selectedValues("es-courses");
    const note=document.getElementById("es-note").value.trim();
    if(!n){alert("请输入学员姓名");return;}
    if(!courseIds.length){alert("请至少选择一个课程/班级");return;}
    let newPays=[...S.payments];
    newPays=newPays.map(p=>{
      if(p.studentId!==sid)return p;
      const ai=document.getElementById("ep-amt-"+p.id);
      const hi=document.getElementById("ep-hrs-"+p.id);
      if(!ai||!hi)return p;
      const av2=parseFloat(ai.value),hv=parseInt(hi.value);return{...p,amount:isNaN(av2)?p.amount:av2,hours:isNaN(hv)?p.hours:hv};});
    const newStus=S.students.map(s=>s.id===sid?{...s,name:n,courseIds,courseId:courseIds[0],note}:s);
    ss({...S,students:newStus,payments:newPays});
    su({modal:null});return;}
  if(a==="del-pay-inline"){
    if(!confirm("确定删除该缴费记录？"))return;
    const pid=el.dataset.pid,sid=el.dataset.sid;
    const newPays=S.payments.filter(p=>p.id!==pid);
    ss({...S,payments:newPays});
    su({modal:{type:"edit-student",sid}});return;}
  if(a==="open-add-pay-for"){su({modal:{type:"add-pay",preStudentId:el.dataset.sid,returnSid:el.dataset.sid}});return;}
  if(a==="addpay"){su({modal:{type:"add-pay"}});return;}
  if(a==="confirm-add-pay"){
    const sid2=document.getElementById("np-stu").value;
    const date=document.getElementById("np-date").value;
    const amt=parseFloat(document.getElementById("np-amt").value)||0;
    const hrs=parseInt(document.getElementById("np-hrs").value)||0;
    const note=document.getElementById("np-note").value.trim();
    if(!date){alert("请选择日期");return;}
    addPay({studentId:sid2,date,amount:amt,hours:hrs,note});
    const ret=el.dataset.returnSid;
    if(ret)su({modal:{type:"edit-student",sid:ret}});
    else su({modal:null});return;}
  if(a==="delpay"){delPay(el.dataset.pid);return;}
  if(a==="addcou"){su({modal:{type:"add-course"}});return;}
  if(a==="confirm-add-course"){
    const n=document.getElementById("nc-name").value.trim();
    const pr=parseFloat(document.getElementById("nc-price").value)||0;
    if(!n){alert("请输入课程名称");return;}
    addCou({name:n,price:pr});su({modal:null});return;}
  if(a==="editprice"){
    const v=prompt("修改单价（¥/课时）：",el.dataset.price);
    if(v===null)return;const n=parseFloat(v);
    if(isNaN(n)||n<0){alert("请输入有效金额");return;}
    updCou(el.dataset.cid,{price:n});return;}
  if(a==="delcou"){delCou(el.dataset.cid);return;}
  if(a==="reset-data"){if(!confirm("⚠️ 确定初始化？将清除所有数据（课程、学员、缴费、考勤、老师、排课），恢复为空白状态。"))return;localStorage.removeItem(KEY);localStorage.removeItem(DEMO_KEY);S=normalizeS({courses:[],students:[],payments:[],attendance:{},teachers:[],schedules:[]});saveS();su({tab:0,calY:new Date().getFullYear(),calM:new Date().getMonth()+1,modal:null,schTeacher:"all",schStudent:"all"});return;}});

document.addEventListener("change",e=>{
  const el=e.target.closest("[data-action]");if(!el)return;
  const a=el.dataset.action;
  if(a==="filter-teacher"){su({schTeacher:el.value});return;}
  if(a==="filter-student"){su({schStudent:el.value});return;}
});

document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="data-import-input"){importData(e.target.files[0]);e.target.value="";}
});

document.addEventListener("keydown",e=>{
  if(!UI.modal)return;
  if(e.key==="Escape"){su({modal:null});return;}
  if(e.key==="Enter"&&UI.modal.type==="time-pick"){
    const t=document.getElementById("time-input");
    const val=t?t.value:"";const cid=document.getElementById("time-course").value;
    setAttendanceForCourse(UI.modal.sid,UI.modal.date,val||1,cid);
    su({modal:null});}});

re();
</script>
</body>
</html>
